// Crash reporter: if the game crashes, show the failed files and the last messages on screen.
(function () {
    // ?plain=on turns this whole reporter off: no hooks on downloads or the console.
    if (new URLSearchParams(location.search).get("plain") === "on") return;
    const ring = [], failed = new Set();
    const origLog = console.log;
    console.log = function (...a) {
        try { ring.push(a.join(" ").slice(0, 150)); if (ring.length > 25) ring.shift(); } catch (e) {}
        return origLog.apply(console, a);
    };
    const oOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (m, u, ...r) {
        const url = String(u);
        this.addEventListener("loadend", () => {
            try { if (this.status === 0 || this.status >= 400) failed.add(this.status + " " + url.slice(0, 130)); } catch (e) {}
        });
        return oOpen.call(this, m, u, ...r);
    };
    // Memory readings every 5 seconds (game heap + page heap). Add ?stats=on to see them on screen while you play.
    const memLog = [];
    function readMem() {
        try {
            const M = window.Module, H = M && (M.HEAP8 || M.HEAPU8);
            const wasm = H ? Math.round(H.byteLength / 1048576) : null;
            const js = performance && performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null;
            return "game memory: " + (wasm === null ? "?" : wasm + " MB") + " | page memory: " + (js === null ? "?" : js + " MB");
        } catch (e) { return "memory: unreadable"; }
    }
    const showStats = new URLSearchParams(location.search).get("stats") === "on";
    let statsEl = null;
    setInterval(() => {
        const line = readMem(); memLog.push(Math.round(performance.now() / 1000) + "s  " + line); if (memLog.length > 12) memLog.shift();
        if (showStats && document.body) {
            if (!statsEl) { statsEl = document.createElement("div"); statsEl.style.cssText = "position:fixed;left:6px;bottom:6px;z-index:99998;font:12px monospace;color:#0f0;background:rgba(0,0,0,.6);padding:3px 6px;pointer-events:none"; document.body.appendChild(statsEl); }
            statsEl.textContent = line;
        }
    }, 5000);
    function show(msg) {
        if (document.getElementById("crashlog")) return;
        const d = document.createElement("pre");
        d.id = "crashlog";
        d.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;margin:0;padding:12px;background:#000;color:#fff;font:12px monospace;white-space:pre-wrap;overflow:auto;text-align:left";
        d.textContent = "CRASH REPORT - take a photo of this screen\nTest variant: " + (window.__variant || "?") + "\n" + msg + "\n\nMEMORY (every 5 s, newest last):\n" + memLog.join("\n") + "\n\nFAILED FILES (last 20):\n" + [...failed].slice(-20).join("\n") + "\n\nLAST MESSAGES:\n" + ring.join("\n") + "\n\n(tap to close)";
        d.onclick = () => d.remove();
        document.body.appendChild(d);
    }
    function withStack(e, m) { try { const s = e && e.error && e.error.stack ? String(e.error.stack).split("\n").slice(0, 14).join("\n") : ""; return s ? m + "\n\nSTACK:\n" + s : m; } catch (x) { return m; } }
    window.addEventListener("error", e => { const m = String(e.message || e); if (/RuntimeError|out of bounds|unreachable|abort/i.test(m)) show(withStack(e, m)); });
    document.addEventListener("webglcontextlost", () => show("WebGL context lost (the graphics driver dropped the game screen)"), true);
    window.addEventListener("unhandledrejection", e => { const m = String(e.reason); if (/RuntimeError|out of bounds|unreachable|abort/i.test(m)) show(withStack({ error: e.reason }, m)); });
})();

(function () {

    const originalPlay = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function () {
        this.muted = true;
        return originalPlay.call(this);
    };

    // Mute Web Audio
    const OriginalAudioContext =
        window.AudioContext || window.webkitAudioContext;

    if (OriginalAudioContext) {
        const originalConnect = AudioNode.prototype.connect;

        AudioNode.prototype.connect = function (destination, ...args) {
            if (destination instanceof AudioDestinationNode) {
                const gain = this.context.createGain();
                gain.gain.value = 0;
                originalConnect.call(this, gain);
                originalConnect.call(gain, destination);
                return destination;
            }

            return originalConnect.call(this, destination, ...args);
        };
    }

    console.log("Game audio muted for testing.");
})();

<script>
alert("Thank Bread from GN-Math for this web-port of gta vice city!");
const loadingText = document.querySelector("#loading-text");
let loadedBytes = 0;
const DB_NAME = "gameFilesDB";
const STORE_NAME = "files";

// Open or create IndexedDB
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
        request.onsuccess = e => resolve(e.target.result);
        request.onerror = e => reject(e.target.error);
    });
}

// Save file to IndexedDB
async function saveFile(name, buffer) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put(buffer, name);
        tx.oncomplete = () => resolve();
        tx.onerror = e => reject(e.target.error);
    });
}

// Get file from IndexedDB
async function getFile(name) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(name);
        request.onsuccess = e => resolve(e.target.result);
        request.onerror = e => reject(e.target.error);
    });
}

// Fetch with progress and caching
async function fetchWithCache(name, url) {
    let cached = await getFile(name);
    if (cached) return cached; // Return cached version

    const response = await fetch(url);
    if (!response.ok) throw new Error(`Download failed (${response.status}): ${url}`);
    if (!response.body) throw new Error(`Empty response body: ${url}`);
    const reader = response.body.getReader();
    let chunks = [];
    let received = 0;

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);

        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = window.__audioOff ? '135.36' : '633.45';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
    }

    let fullBuffer = new Uint8Array(received);
    let offset = 0;
    for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
    }

    if (received === 0) throw new Error(`Downloaded an empty file: ${url}`);
    await saveFile(name, fullBuffer.buffer); // Cache it
    return fullBuffer.buffer;
}

// Merge multiple parts
async function mergeFiles(fileParts, namePrefix) {
    const buffers = [];
    for (let i = 0; i < fileParts.length; i++) {
        const buffer = await fetchWithCache(`${namePrefix}.part${i+1}`, fileParts[i]);
        buffers.push(buffer);
    }
    const mergedBlob = new Blob(buffers);
    return URL.createObjectURL(mergedBlob);
}

// Generate part URLs
function getParts(file, start, end) {
    let parts = [];
    for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
    }
    return parts;
}

// Put the original bytes back over my changes (only used when base=orig)
async function applyOrigPatch(buffers) {
    const r = await fetch(REPO + "orig_patch.bin?v=1");
    if (!r.ok) throw new Error("orig_patch.bin not found in the repo (" + r.status + ")");
    const pb = new Uint8Array(await r.arrayBuffer()), dv = new DataView(pb.buffer);
    const u1 = new Uint8Array(buffers[0]), u2 = new Uint8Array(buffers[1]), S1 = u1.length;

    while (p < pb.length) {
        const off = dv.getUint32(p, true), len = dv.getUint32(p + 4, true); p += 8;
        for (let i = 0; i < len; i++) { const o = off + i; if (o < S1) u1[o] = pb[p + i]; else u2[o - S1] = pb[p + i]; }

    adf("audio/fever.adf", 1, 3, "fever.adf"),
    adf("audio/flash.adf", 1, 3, "flash.adf"),
    adf("audio/kchat.adf", 1, 3, "kchat.adf"),
    adf("audio/vcpr.adf", 1, 2, "vcpr.adf"),
    adf("audio/vrock.adf", 1, 4, "vrock.adf"),
    adf("audio/wave.adf", 1, 4, "wave.adf"),
    adf("audio/wild.adf", 1, 4, "wild.adf"),
]).then(async ([indexdataurl, EMOTIONadfurl, ESPANTadfurl, FEVERadfurl, FLASHadfurl, KCHATadfurl, VCPRadfurl, VROCKadfurl, WAVEadfurl, WILDadfurl]) => {
    
    // Override fetch to use cached URLs
    // Backup redirect: serve the replacement models from this repo's /models folder
    const MODEL_BASE = "https://raw.githubusercontent.com/hikeryan/Vice-city-emergency-key-/main/models/";
    const NPC_FILES = ["hfypr.dff", "hfypr.txd", "bfypr.dff", "bfypr.txd", "wfypr.dff", "wfypr.txd"];
    const PARTICLE_FILES = ["particle.txd"];
    const MODEL_FILES = REDIR_MODE === "none" ? [] : REDIR_MODE === "npc" ? NPC_FILES : REDIR_MODE === "particle" ? PARTICLE_FILES : NPC_FILES.concat(PARTICLE_FILES);
    function modelRedirect(u) {
        const low = String(u).toLowerCase().split("?")[0];
        const name = low.substring(low.lastIndexOf("/") + 1);
        if (SFX_OFF && /audio[\\\/].*\.mp3$/.test(low)) return SILENT_URL;
        return MODEL_FILES.includes(name) ? MODEL_BASE + name + "?v=9" : null;
    }

    const originalFetch = window.fetch;
    window.fetch = async function(input, init) {
        let urlString = input instanceof Request ? input.url : String(input);
        { const r = modelRedirect(urlString); if (r) return originalFetch(r, init); }

        if (urlString.toLowerCase().includes("index.data".toLowerCase())) input = indexdataurl;
        else if (urlString.toLowerCase().includes("emotion.adf".toLowerCase())) input = EMOTIONadfurl;
        else if (urlString.toLowerCase().includes("espant.adf".toLowerCase())) input = ESPANTadfurl;
        else if (urlString.toLowerCase().includes("fever.adf".toLowerCase())) input = FEVERadfurl;
        else if (urlString.toLowerCase().includes("flash.adf".toLowerCase())) input = FLASHadfurl;
        else if (urlString.toLowerCase().includes("kchat.adf".toLowerCase())) input = KCHATadfurl;
        else if (urlString.toLowerCase().includes("VCPR.adf".toLowerCase())) input = VCPRadfurl;
        else if (urlString.toLowerCase().includes("VROCK.adf".toLowerCase())) input = VROCKadfurl;
        else if (urlString.toLowerCase().includes("WAVE.adf".toLowerCase())) input = WAVEadfurl;
        else if (urlString.toLowerCase().includes("WILD.adf".toLowerCase())) input = WILDadfurl;

        return originalFetch(input, init);
      };

    // Similarly override XHR
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        { const r = modelRedirect(url); if (r) return originalOpen.call(this, method, r, ...rest); }
        if (url.includes("https://cdn.dos.zone/vcsky/fetched/".toLowerCase())) url = url.replace("https://cdn.dos.zone/vcsky/fetched/", "")
        if (url.toLowerCase().includes("index.data".toLowerCase())) url = indexdataurl;
        else if (url.toLowerCase().includes("emotion.adf".toLowerCase())) url = EMOTIONadfurl;
        else if (url.toLowerCase().includes("espant.adf".toLowerCase())) url = ESPANTadfurl;
        else if (url.toLowerCase().includes("fever.adf".toLowerCase())) url = FEVERadfurl;
        else if (url.toLowerCase().includes("flash.adf".toLowerCase())) url = FLASHadfurl;
        else if (url.toLowerCase().includes("KCHAT.adf".toLowerCase())) url = KCHATadfurl;
        else if (url.toLowerCase().includes("VCPR.adf".toLowerCase())) url = VCPRadfurl;
        else if (url.toLowerCase().includes("VROCK.adf".toLowerCase())) url = VROCKadfurl;
        else if (url.toLowerCase().includes("WAVE.adf".toLowerCase())) url = WAVEadfurl;
        else if (url.toLowerCase().includes("WILD.adf".toLowerCase())) url = WILDadfurl;
       return originalOpen.call(this, method, url, ...rest);
    };

    // Load game scripts in the correct order
    async function loadScript(src) {
        await new Promise((resolve, reject) => {
            const script = document.createElement("script");
           script.src = src.startsWith("https://")
    ? src
    : "https://cdn.jsdelivr.net/gh/web-ports/vice-city@796678be4ed26a13c1256be98781ca9b90beb981/" + src;
            script.onload = resolve;
            script.onerror = () => reject(new Error("Failed to load " + src));
            document.body.appendChild(script);
        });
    }

    try {
        await loadScript("GamepadEmulator.js");
        await loadScript("idbfs.js");
        await loadScript(new URL("./game.js", window.location.href).href);
        loadingText.remove();
    } catch (error) {
        console.error(error);
        loadingText.textContent = "Loading failed: " + error.message;
    }
});
